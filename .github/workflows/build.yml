name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Cache AI Models
        id: cache-models
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/*.onnx
          key: bgremover-ai-models-v2

      - name: Download Fast & HD BG Models + MI-GAN Magic Eraser
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 --retry-delay 5 \
            -o app/src/main/assets/model_fast.onnx \
            https://github.com/danielgatis/rembg/releases/download/v0.0.0/silueta.onnx
          curl -L --fail --retry 3 --retry-delay 5 \
            -o app/src/main/assets/model_hd.onnx \
            https://github.com/danielgatis/rembg/releases/download/v0.0.0/isnet-general-use.onnx
          curl -L --fail --retry 3 --retry-delay 5 \
            -o app/src/main/assets/migan.onnx \
            https://huggingface.co/andraniksargsyan/migan/resolve/main/migan_pipeline_v2.onnx

      - run: gradle assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: BgRemover-apk
          path: app/build/outputs/apk/debug/app-debug.apk
