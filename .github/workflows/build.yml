name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          cache-disabled: true
      - name: Download BiRefNet AI Model
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail -o app/src/main/assets/model.onnx https://github.com/danielgatis/rembg/releases/download/v0.0.0/BiRefNet-general-bb_swin_v1_tiny-epoch_232.onnx
      - run: gradle assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: BgRemover-apk
          path: app/build/outputs/apk/debug/app-debug.apk
